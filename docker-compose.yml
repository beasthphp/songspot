services:
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      FRONTEND_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://songspot:songspot@db:5432/songspot
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: songspot
      POSTGRES_USER: songspot
      POSTGRES_PASSWORD: songspot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
